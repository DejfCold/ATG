name: Build installer

on:
  push:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained installer
        run: python3 build-installer.py dist/atg-installer
      - name: Save installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: atg-installer
          path: dist/atg-installer
          if-no-files-found: error
          retention-days: 14
